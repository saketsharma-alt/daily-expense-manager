<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Daily Expense Manager</title>

  <meta name="theme-color" content="#16a34a">
  <meta name="description" content="Daily Expense Manager">

  <link rel="manifest" href="./manifest.webmanifest">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #111827;
    }

    header {
      background: #16a34a;
      color: white;
      padding: 18px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 13px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 15px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 14px;
      color: #64748b;
    }

    .amount {
      font-size: 22px;
      font-weight: bold;
      color: #16a34a;
    }

    .section {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .section h2 {
      margin-top: 0;
      font-size: 18px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #16a34a;
    }

    textarea {
      min-height: 70px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 11px 15px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary {
      background: #16a34a;
      color: white;
      width: 100%;
      margin-top: 15px;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #111827;
    }

    .btn-share {
      background: #2563eb;
      color: white;
    }

    .btn-history {
      background: #7c3aed;
      color: white;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .expense-item {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      background: #f8fafc;
    }

    .expense-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .expense-name {
      font-weight: bold;
    }

    .expense-amount {
      font-weight: bold;
      color: #dc2626;
    }

    .expense-meta {
      color: #64748b;
      font-size: 12px;
      margin-top: 5px;
    }

    .delete-btn {
      margin-top: 8px;
      background: #fee2e2;
      color: #dc2626;
      padding: 7px 10px;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      color: #64748b;
      padding: 20px;
    }

    .category-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 0;
    }

    .category-row:last-child {
      border-bottom: none;
    }

    .bar-container {
      margin-top: 10px;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .bar {
      height: 10px;
      background: #dcfce7;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #16a34a;
      border-radius: 10px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 100;
      overflow-y: auto;
      padding: 20px;
    }

    .modal-box {
      max-width: 650px;
      margin: 30px auto;
      background: white;
      border-radius: 15px;
      padding: 18px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .modal-header h2 {
      margin: 0;
    }

    .close-btn {
      background: #e2e8f0;
      font-size: 20px;
      padding: 5px 10px;
    }

    .share-preview {
      white-space: pre-wrap;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      margin-top: 15px;
      max-height: 350px;
      overflow-y: auto;
      font-size: 13px;
    }

    .history-date {
      background: #f1f5f9;
      padding: 10px;
      border-radius: 9px;
      margin-top: 15px;
      font-weight: bold;
    }

    .history-total {
      color: #16a34a;
      margin-left: 5px;
    }

    .small-text {
      color: #64748b;
      font-size: 12px;
    }

    @media (max-width: 450px) {
      .cards {
        grid-template-columns: 1fr 1fr;
      }

      .button-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Daily Expense Manager</h1>
  <p>Manage your daily expenses easily</p>
</header>

<div class="container">

  <!-- DASHBOARD -->
  <div class="cards">

    <div class="card">
      <h3>Today's Total</h3>
      <div class="amount" id="todayTotal">₹0</div>
    </div>

    <div class="card">
      <h3>Monthly Total</h3>
      <div class="amount" id="monthTotal">₹0</div>
    </div>

    <div class="card">
      <h3>Total Entries</h3>
      <div class="amount" id="entryCount">0</div>
    </div>

    <div class="card">
      <h3>Today's Date</h3>
      <div id="todayDate" class="small-text"></div>
    </div>

  </div>


  <!-- ADD EXPENSE -->
  <div class="section">

    <h2>Add Expense</h2>

    <label for="category">Category</label>

    <select id="category">
      <option value="🥛 दूध">🥛 दूध</option>
      <option value="🥦 सब्जी">🥦 सब्जी</option>
      <option value="🍿 नमकीन">🍿 नमकीन</option>
      <option value="🍎 फल">🍎 फल</option>
      <option value="🛒 किराना">🛒 किराना</option>
      <option value="🚗 यात्रा">🚗 यात्रा</option>
      <option value="📱 मोबाइल / रिचार्ज">📱 मोबाइल / रिचार्ज</option>
      <option value="💊 दवाई">💊 दवाई</option>
      <option value="🍽️ बाहर का खाना">🍽️ बाहर का खाना</option>
      <option value="⚡ बिजली / बिल">⚡ बिजली / बिल</option>
      <option value="🏠 घर का खर्च">🏠 घर का खर्च</option>
      <option value="📦 अन्य">📦 अन्य</option>
    </select>


    <label for="productName">वस्तु / सामान का नाम</label>

    <input
      type="text"
      id="productName"
      placeholder="जैसे दूध, आलू, चिप्स, शर्ट आदि"
    >


    <label for="amount">Amount (₹)</label>

    <input
      type="number"
      id="amount"
      placeholder="जैसे 100"
      min="0"
      step="0.01"
    >


    <label for="date">Date</label>

    <input type="date" id="date">


    <label for="time">Time</label>

    <input type="time" id="time">


    <label for="note">Note (Optional)</label>

    <textarea
      id="note"
      placeholder="कोई अतिरिक्त जानकारी..."
    ></textarea>


    <button
      class="btn-primary"
      type="button"
      onclick="addExpense()"
    >
      Save Expense
    </button>


    <div class="button-row">

      <button
        class="btn-secondary"
        type="button"
        onclick="resetForm()"
      >
        Clear
      </button>

      <button
        class="btn-history"
        type="button"
        onclick="showHistory()"
      >
        📜 History
      </button>

    </div>

  </div>


  <!-- SHARE -->
  <div class="section">

    <h2>Share Expenses</h2>

    <p class="small-text">
      Select a date range and share your expenses.
    </p>

    <button
      class="btn-share"
      type="button"
      onclick="toggleShareBox()"
    >
      📤 Share
    </button>

  </div>


  <!-- CURRENT MONTH -->
  <div class="section">

    <h2>Current Month Expenses</h2>

    <div id="expenseList"></div>

  </div>


  <!-- CATEGORY SUMMARY -->
  <div class="section">

    <h2>Category Summary</h2>

    <div id="categorySummary"></div>

  </div>


  <!-- DAILY GRAPH -->
  <div class="section">

    <h2>Daily Expense Graph</h2>

    <div id="dailyGraph"></div>

  </div>

</div>


<!-- SHARE MODAL -->
<div id="shareModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h2>Share Expenses</h2>

      <button
        class="close-btn"
        type="button"
        onclick="hideShareBox()"
      >
        ×
      </button>

    </div>


    <label for="fromDate">From Date</label>

    <input type="date" id="fromDate">


    <label for="toDate">To Date</label>

    <input type="date" id="toDate">


    <button
      class="btn-primary"
      type="button"
      onclick="shareDateRange()"
    >
      📤 Generate & Share
    </button>


    <div
      id="sharePreview"
      class="share-preview"
      style="display:none;"
    ></div>

  </div>

</div>


<!-- HISTORY MODAL -->
<div id="historyModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h2>📜 Expense History</h2>

      <button
        class="close-btn"
        type="button"
        onclick="hideHistory()"
      >
        ×
      </button>

    </div>


    <div id="historyList"></div>

  </div>

</div>


<script>

  /* =========================
     DATA
  ========================= */

  const STORAGE_KEY = "dem_expenses";

  let expenses = [];


  /* =========================
     CATEGORY LIST
  ========================= */

  const CATEGORIES = [
    "🥛 दूध",
    "🥦 सब्जी",
    "🍿 नमकीन",
    "🍎 फल",
    "🛒 किराना",
    "🚗 यात्रा",
    "📱 मोबाइल / रिचार्ज",
    "💊 दवाई",
    "🍽️ बाहर का खाना",
    "⚡ बिजली / बिल",
    "🏠 घर का खर्च",
    "📦 अन्य"
  ];


  /* =========================
     DATE FUNCTIONS
  ========================= */

  function getToday() {

    const now = new Date();

    const year = now.getFullYear();

    const month = String(now.getMonth() + 1).padStart(2, "0");

    const day = String(now.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }


  function getCurrentTime() {

    const now = new Date();

    const hours = String(now.getHours()).padStart(2, "0");

    const minutes = String(now.getMinutes()).padStart(2, "0");

    return `${hours}:${minutes}`;
  }


  function formatDate(dateString) {

    if (!dateString) return "";

    const parts = dateString.split("-");

    if (parts.length !== 3) return dateString;

    return `${parts[2]}-${parts[1]}-${parts[0]}`;
  }


  function monthKey(dateString) {

    return dateString.substring(0, 7);

  }


  /* =========================
     LOAD DATA
  ========================= */

  function loadExpenses() {

    try {

      const saved = localStorage.getItem(STORAGE_KEY);

      if (saved) {

        const parsed = JSON.parse(saved);

        if (Array.isArray(parsed)) {

          expenses = parsed;

        } else {

          expenses = [];

        }

      } else {

        expenses = [];

      }

    } catch (error) {

      console.error("Load error:", error);

      expenses = [];

    }

  }


  /* =========================
     SAVE DATA
  ========================= */

  function saveExpenses() {

    try {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(expenses)
      );

      return true;

    } catch (error) {

      console.error("Save error:", error);

      alert("Expense save nahi ho pa raha. Browser storage problem hai.");

      return false;

    }

  }


  /* =========================
     ADD EXPENSE
  ========================= */

  function addExpense() {

    const category =
      document.getElementById("category").value;

    const productInput =
      document.getElementById("productName").value.trim();

    const amountValue =
      document.getElementById("amount").value;

    const date =
      document.getElementById("date").value;

    const time =
      document.getElementById("time").value;

    const note =
      document.getElementById("note").value.trim();


    const amount = Number(amountValue);


    if (!date) {

      alert("Please select date.");

      return;

    }


    if (!amountValue || amount <= 0) {

      alert("Please enter a valid amount.");

      document.getElementById("amount").focus();

      return;

    }


    if (
      category === "📦 अन्य" &&
      !productInput
    ) {

      alert("अन्य category में वस्तु / सामान का नाम लिखें।");

      document.getElementById("productName").focus();

      return;

    }


    let product = productInput;


    if (!product) {

      product = category;

    }


    const newExpense = {

      id: Date.now(),

      category: category,

      product: product,

      amount: amount,

      date: date,

      time: time || getCurrentTime(),

      note: note

    };


    expenses.push(newExpense);


    if (!saveExpenses()) {

      return;

    }


    resetForm();

    render();


    alert("Expense saved successfully!");

  }


  /* =========================
     CLEAR FORM
  ========================= */

  function resetForm() {

    document.getElementById("productName").value = "";

    document.getElementById("amount").value = "";

    document.getElementById("note").value = "";

    document.getElementById("date").value = getToday();

    document.getElementById("time").value = getCurrentTime();

    document.getElementById("category").value = CATEGORIES[0];

  }


  /* =========================
     DELETE EXPENSE
  ========================= */

  function deleteExpense(id) {

    const confirmDelete =
      confirm("Kya aap is expense ko delete karna chahte hain?");


    if (!confirmDelete) {

      return;

    }


    expenses = expenses.filter(
      expense => expense.id !== id
    );


    saveExpenses();

    render();

    renderHistory();

  }


  /* =========================
     TODAY TOTAL
  ========================= */

  function calculateTodayTotal() {

    const today = getToday();

    return expenses
      .filter(item => item.date === today)
      .reduce(
        (total, item) => total + Number(item.amount),
        0
      );

  }


  /* =========================
     MONTH TOTAL
  ========================= */

  function calculateMonthTotal() {

    const currentMonth = monthKey(getToday());

    return expenses
      .filter(
        item => monthKey(item.date) === currentMonth
      )
      .reduce(
        (total, item) => total + Number(item.amount),
        0
      );

  }


  /* =========================
     UPDATE DASHBOARD
  ========================= */

  function updateDashboard() {

    const todayTotal =
      calculateTodayTotal();

    const monthTotal =
      calculateMonthTotal();


    document.getElementById("todayTotal").textContent =
      "₹" + todayTotal.toFixed(2);


    document.getElementById("monthTotal").textContent =
      "₹" + monthTotal.toFixed(2);


    const currentMonth =
      monthKey(getToday());


    const monthEntries =
      expenses.filter(
        item => monthKey(item.date) === currentMonth
      );


    document.getElementById("entryCount").textContent =
      monthEntries.length;


    document.getElementById("todayDate").textContent =
      formatDate(getToday());

  }


  /* =========================
     CURRENT MONTH EXPENSES
  ========================= */

  function renderExpenseList() {

    const container =
      document.getElementById("expenseList");


    const currentMonth =
      monthKey(getToday());


    const list =
      expenses
        .filter(
          item => monthKey(item.date) === currentMonth
        )
        .sort(
          (a, b) => {

            if (a.date !== b.date) {

              return b.date.localeCompare(a.date);

            }

            return (b.time || "").localeCompare(
              a.time || ""
            );

          }
        );


    if (list.length === 0) {

      container.innerHTML =
        '<div class="empty">No expenses found.</div>';

      return;

    }


    let html = "";


    list.forEach(item => {

      html += `

        <div class="expense-item">

          <div class="expense-top">

            <div>

              <div class="expense-name">
                ${escapeHTML(item.product)}
              </div>

              <div class="expense-meta">
                ${escapeHTML(item.category)}
                • ${formatDate(item.date)}
                • ${escapeHTML(item.time || "")}
              </div>

            </div>

            <div class="expense-amount">
              ₹${Number(item.amount).toFixed(2)}
            </div>

          </div>


          ${
            item.note
              ? `
                <div class="expense-meta">
                  Note: ${escapeHTML(item.note)}
                </div>
              `
              : ""
          }


          <button
            class="delete-btn"
            type="button"
            onclick="deleteExpense(${item.id})"
          >
            Delete
          </button>

        </div>

      `;

    });


    container.innerHTML = html;

  }


  /* =========================
     CATEGORY SUMMARY
  ========================= */

  function renderCategorySummary() {

    const container =
      document.getElementById("categorySummary");


    const currentMonth =
      monthKey(getToday());


    const currentExpenses =
      expenses.filter(
        item => monthKey(item.date) === currentMonth
      );


    if (currentExpenses.length === 0) {

      container.innerHTML =
        '<div class="empty">No category data.</div>';

      return;

    }


    const totals = {};


    currentExpenses.forEach(item => {

      const category =
        item.category || "अन्य";


      if (!totals[category]) {

        totals[category] = 0;

      }


      totals[category] += Number(item.amount);

    });


    const sorted =
      Object.entries(totals)
        .sort((a, b) => b[1] - a[1]);


    const max =
      sorted.length
        ? sorted[0][1]
        : 1;


    let html = "";


    sorted.forEach(([category, total]) => {

      const percentage =
        max > 0
          ? (total / max) * 100
          : 0;


      html += `

        <div class="bar-container">

          <div class="bar-label">

            <span>
              ${escapeHTML(category)}
            </span>

            <strong>
              ₹${total.toFixed(2)}
            </strong>

          </div>

          <div class="bar">

            <div
              class="bar-fill"
              style="width:${percentage}%"
            ></div>

          </div>

        </div>

      `;

    });


    container.innerHTML = html;

  }


  /* =========================
     DAILY GRAPH
  ========================= */

  function renderDailyGraph() {

    const container =
      document.getElementById("dailyGraph");


    const currentMonth =
      monthKey(getToday());


    const currentExpenses =
      expenses.filter(
        item => monthKey(item.date) === currentMonth
      );


    if (currentExpenses.length === 0) {

      container.innerHTML =
        '<div class="empty">No graph data.</div>';

      return;

    }


    const daily = {};


    currentExpenses.forEach(item => {

      if (!daily[item.date]) {

        daily[item.date] = 0;

      }


      daily[item.date] += Number(item.amount);

    });


    const sortedDates =
      Object.keys(daily).sort();


    const max =
      Math.max(
        ...sortedDates.map(
          date => daily[date]
        )
      );


    let html = "";


    sortedDates.forEach(date => {

      const total =
        daily[date];


      const percentage =
        max > 0
          ? (total / max) * 100
          : 0;


      html += `

        <div class="bar-container">

          <div class="bar-label">

            <span>
              ${formatDate(date)}
            </span>

            <strong>
              ₹${total.toFixed(2)}
            </strong>

          </div>


          <div class="bar">

            <div
              class="bar-fill"
              style="width:${percentage}%"
            ></div>

          </div>

        </div>

      `;

    });


    container.innerHTML = html;

  }


  /* =========================
     HISTORY
  ========================= */

  function showHistory() {

    document.getElementById("historyModal").style.display =
      "block";


    renderHistory();

  }


  function hideHistory() {

    document.getElementById("historyModal").style.display =
      "none";

  }


  function renderHistory() {

    const container =
      document.getElementById("historyList");


    if (expenses.length === 0) {

      container.innerHTML =
        '<div class="empty">No expense history.</div>';

      return;

    }


    const sorted =
      [...expenses].sort((a, b) => {

        if (a.date !== b.date) {

          return b.date.localeCompare(a.date);

        }

        return (b.time || "").localeCompare(
          a.time || ""
        );

      });


    const grouped = {};


    sorted.forEach(item => {

      if (!grouped[item.date]) {

        grouped[item.date] = [];

      }


      grouped[item.date].push(item);

    });


    let html = "";


    Object.keys(grouped).forEach(date => {

      const dayExpenses =
        grouped[date];


      const dailyTotal =
        dayExpenses.reduce(
          (sum, item) =>
            sum + Number(item.amount),
          0
        );


      html += `

        <div class="history-date">

          ${formatDate(date)}

          <span class="history-total">
            ₹${dailyTotal.toFixed(2)}
          </span>

        </div>

      `;


      dayExpenses.forEach(item => {

        html += `

          <div class="expense-item">

            <div class="expense-top">

              <div>

                <div class="expense-name">
                  ${escapeHTML(item.product)}
                </div>

                <div class="expense-meta">
                  ${escapeHTML(item.category)}
                  • ${escapeHTML(item.time || "")}
                </div>

              </div>

              <div class="expense-amount">
                ₹${Number(item.amount).toFixed(2)}
              </div>

            </div>


            ${
              item.note
                ? `
                  <div class="expense-meta">
                    ${escapeHTML(item.note)}
                  </div>
                `
                : ""
            }


            <button
              class="delete-btn"
              type="button"
              onclick="deleteExpense(${item.id})"
            >
              Delete
            </button>

          </div>

        `;

      });

    });


    container.innerHTML = html;

  }


  /* =========================
     SHARE MODAL
  ========================= */

  function toggleShareBox() {

    const today = getToday();


    document.getElementById("fromDate").value =
      today;


    document.getElementById("toDate").value =
      today;


    document.getElementById("sharePreview").style.display =
      "none";


    document.getElementById("shareModal").style.display =
      "block";

  }


  function hideShareBox() {

    document.getElementById("shareModal").style.display =
      "none";

  }


  /* =========================
     CREATE SHARE TEXT
  ========================= */

  function createShareText(fromDate, toDate) {

    const selected =
      expenses
        .filter(
          item =>
            item.date >= fromDate &&
            item.date <= toDate
        )
        .sort((a, b) => {

          if (a.date !== b.date) {

            return a.date.localeCompare(b.date);

          }

          return (a.time || "").localeCompare(
            b.time || ""
          );

        });


    if (selected.length === 0) {

      return "";

    }


    const grouped = {};


    selected.forEach(item => {

      if (!grouped[item.date]) {

        grouped[item.date] = [];

      }


      grouped[item.date].push(item);

    });


    let text =
      "📊 DAILY EXPENSE REPORT\n";

    text +=
      "━━━━━━━━━━━━━━━━━━\n";

    text +=
      `From: ${formatDate(fromDate)}\n`;

    text +=
      `To: ${formatDate(toDate)}\n`;

    text +=
      "━━━━━━━━━━━━━━━━━━\n\n";


    let grandTotal = 0;


    Object.keys(grouped).forEach(date => {

      const dayItems =
        grouped[date];


      const dayTotal =
        dayItems.reduce(
          (sum, item) =>
            sum + Number(item.amount),
          0
        );


      grandTotal += dayTotal;


      text +=
        `📅 ${formatDate(date)}\n`;


      dayItems.forEach(item => {

        text +=
          `• ${item.product} — ₹${Number(item.amount).toFixed(2)}`;


        if (item.time) {

          text +=
            ` (${item.time})`;

        }


        text += "\n";

      });


      text +=
        `Day Total: ₹${dayTotal.toFixed(2)}\n\n`;

    });


    text +=
      "━━━━━━━━━━━━━━━━━━\n";

    text +=
      `💰 TOTAL: ₹${grandTotal.toFixed(2)}\n`;

    text +=
      "━━━━━━━━━━━━━━━━━━\n";

    text +=
      "Generated by Daily Expense Manager";


    return text;

  }


  /* =========================
     SHARE DATE RANGE
  ========================= */

  async function shareDateRange() {

    const fromDate =
      document.getElementById("fromDate").value;


    const toDate =
      document.getElementById("toDate").value;


    if (!fromDate || !toDate) {

      alert("Please select both dates.");

      return;

    }


    if (fromDate > toDate) {

      alert("From Date cannot be greater than To Date.");

      return;

    }


    const text =
      createShareText(
        fromDate,
        toDate
      );


    const preview =
      document.getElementById("sharePreview");


    if (!text) {

      preview.style.display = "block";

      preview.textContent =
        "Is date range mein koi expense nahi mila.";

      return;

    }


    preview.style.display = "block";

    preview.textContent = text;


    /* Native Share */

    if (
      navigator.share &&
      typeof navigator.share === "function"
    ) {

      try {

        await navigator.share({

          title: "Daily Expense Report",

          text: text

        });


        return;

      } catch (error) {

        console.log(
          "Share cancelled or unavailable",
          error
        );

      }

    }


    /* Clipboard fallback */

    try {

      if (
        navigator.clipboard &&
        navigator.clipboard.writeText
      ) {

        await navigator.clipboard.writeText(text);

        alert(
          "Share option available nahi hai. Report clipboard mein copy ho gayi hai."
        );

        return;

      }

    } catch (error) {

      console.log(
        "Clipboard error",
        error
      );

    }


    alert(
      "Report generate ho gayi hai. Neeche se text copy karein."
    );

  }


  /* =========================
     ESCAPE HTML
  ========================= */

  function escapeHTML(value) {

    const div =
      document.createElement("div");

    div.textContent =
      value == null
        ? ""
        : String(value);

    return div.innerHTML;

  }


  /* =========================
     RENDER EVERYTHING
  ========================= */

  function render() {

    updateDashboard();

    renderExpenseList();

    renderCategorySummary();

    renderDailyGraph();

  }


  /* =========================
     CLOSE MODAL WHEN OUTSIDE
  ========================= */

  window.addEventListener(
    "click",
    function(event) {

      const shareModal =
        document.getElementById("shareModal");

      const historyModal =
        document.getElementById("historyModal");


      if (event.target === shareModal) {

        hideShareBox();

      }


      if (event.target === historyModal) {

        hideHistory();

      }

    }
  );


  /* =========================
     SERVICE WORKER
  ========================= */

  if ("serviceWorker" in navigator) {

    window.addEventListener(
      "load",
      function() {

        navigator.serviceWorker
          .register("./sw.js")
          .then(
            registration => {

              console.log(
                "Service Worker registered:",
                registration.scope
              );

            }
          )
          .catch(
            error => {

              console.log(
                "Service Worker error:",
                error
              );

            }
          );

      }
    );

  }


  /* =========================
     START APP
  ========================= */

  loadExpenses();

  resetForm();

  render();

</script>
