<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Expense Manager</title>

<style>
:root{
--bg:#f5f7fb;--card:#fff;--text:#18202a;--muted:#697386;
--line:#e7eaf0;--accent:#5b5bd6;--accent2:#8b5cf6;
--good:#16855b;--danger:#d94b5b;
--shadow:0 10px 30px rgba(20,30,50,.07)
}

*{box-sizing:border-box}

body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
background:var(--bg);
color:var(--text)
}

button,input,select{font:inherit}

.app{
max-width:1100px;
margin:auto;
padding:18px
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
margin-bottom:18px
}

.brand h1{
margin:0;
font-size:25px
}

.brand p{
margin:4px 0;
color:var(--muted);
font-size:13px
}

.btn{
border:0;
border-radius:12px;
padding:11px 15px;
cursor:pointer;
font-weight:700
}

.primary{
background:var(--accent);
color:white
}

.ghost{
background:var(--card);
border:1px solid var(--line);
color:var(--text)
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:17px;
padding:17px;
box-shadow:var(--shadow)
}

.stat small{
color:var(--muted)
}

.stat strong{
display:block;
font-size:24px;
margin-top:7px
}

.grid{
display:grid;
grid-template-columns:1.35fr .85fr;
gap:14px;
margin-top:14px
}

.section-title{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
gap:10px
}

.section-title h2{
font-size:17px;
margin:0
}

.month input{
border:1px solid var(--line);
padding:9px;
border-radius:10px
}

.bars{
height:230px;
display:flex;
align-items:end;
gap:7px;
padding:12px 4px 2px;
overflow-x:auto
}

.barwrap{
flex:1;
min-width:12px;
height:100%;
display:flex;
flex-direction:column;
justify-content:end;
align-items:center;
gap:5px
}

.bar{
width:100%;
max-width:30px;
border-radius:7px 7px 2px 2px;
background:linear-gradient(180deg,var(--accent2),var(--accent));
min-height:3px
}

.barwrap span{
font-size:10px;
color:var(--muted)
}

.cat{
display:flex;
align-items:center;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid var(--line)
}

.cat:last-child{
border:0
}

.catname{
display:flex;
gap:8px;
align-items:center
}

.formgrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.field{
display:flex;
flex-direction:column;
gap:5px
}

.field.full{
grid-column:1/-1
}

.field label{
font-size:12px;
color:var(--muted)
}

.field input,
.field select{
padding:11px;
border:1px solid var(--line);
border-radius:11px;
background:white
}

.actions{
display:flex;
gap:8px;
margin-top:10px;
flex-wrap:wrap
}

.expenses{
margin-top:14px
}

.row{
display:grid;
grid-template-columns:1.1fr .8fr .7fr auto;
gap:10px;
align-items:center;
padding:12px 0;
border-bottom:1px solid var(--line);
font-size:14px
}

.row:last-child{
border:0
}

.pill{
font-size:11px;
padding:5px 8px;
border-radius:20px;
background:#f0efff;
color:#4d4db7;
width:max-content
}

.delete{
border:0;
background:#fff0f2;
color:var(--danger);
border-radius:9px;
padding:7px 9px;
cursor:pointer
}

.empty{
text-align:center;
color:var(--muted);
padding:25px
}

.budgetline{
height:10px;
background:#edf0f5;
border-radius:20px;
overflow:hidden;
margin:10px 0
}

.budgetfill{
height:100%;
background:linear-gradient(90deg,var(--accent),var(--accent2));
border-radius:20px
}

.muted{
color:var(--muted);
font-size:12px
}

.history-card{
margin-top:14px
}

.share-box{
display:none;
margin-top:14px;
padding:15px;
border:1px solid var(--line);
border-radius:14px;
background:#fafaff
}

.share-box.show{
display:block
}

.share-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.share-actions{
display:flex;
gap:8px;
margin-top:10px;
flex-wrap:wrap
}

.history-date{
font-weight:800;
font-size:15px;
padding:12px 0 6px;
border-bottom:1px solid var(--line)
}

.history-item{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:10px 0;
border-bottom:1px solid var(--line)
}

.history-item:last-child{
border-bottom:0
}

.history-left{
display:flex;
flex-direction:column;
gap:3px
}

.history-right{
display:flex;
align-items:center;
gap:8px
}

@media(max-width:800px){

.stats{
grid-template-columns:1fr 1fr
}

.grid{
grid-template-columns:1fr
}

.row{
grid-template-columns:1fr auto
}

.row>*:nth-child(2),
.row>*:nth-child(3){
font-size:12px
}

.formgrid{
grid-template-columns:1fr
}

.field.full{
grid-column:auto
}

.share-grid{
grid-template-columns:1fr
}

}

@media(max-width:450px){

.app{
padding:12px
}

.stats{
gap:8px
}

.card{
padding:13px
}

.stat strong{
font-size:19px
}

.top .btn{
padding:9px 10px
}

.history-item{
align-items:flex-start;
flex-direction:column
}

}
</style>
</head>

<body>

<main class="app">

<header class="top">

<div class="brand">

<h1>💰 Daily Expense Manager</h1>

<p>हर दिन का खर्च आसान तरीके से सेव करें</p>

</div>

<button class="btn primary" onclick="focusForm()">
＋ खर्च जोड़ें
</button>

</header>


<!-- STATS -->

<section class="stats">

<div class="card stat">
<small>इस महीने का खर्च</small>
<strong id="total">₹0</strong>
</div>

<div class="card stat">
<small>आज का खर्च</small>
<strong id="today">₹0</strong>
</div>

<div class="card stat">
<small>Daily Average</small>
<strong id="avg">₹0</strong>
</div>

<div class="card stat">
<small>कुल Entries</small>
<strong id="count">0</strong>
</div>

</section>


<!-- GRAPH + BUDGET -->

<div class="grid">

<section class="card">

<div class="section-title">

<h2>📈 Daily Expense</h2>

<div class="month">
<input id="month" type="month">
</div>

</div>

<div id="bars" class="bars"></div>

</section>


<section class="card">

<div class="section-title">
<h2>🎯 Monthly Budget</h2>
</div>

<div class="field">

<label>Budget (₹)</label>

<input
id="budget"
type="number"
min="0"
placeholder="जैसे 10000"
>

</div>

<div class="budgetline">

<div
id="budgetfill"
class="budgetfill"
style="width:0%">
</div>

</div>

<div id="budgettext" class="muted">
Budget set नहीं है
</div>


<div style="margin-top:15px">

<div class="section-title">
<h2>📊 Categories</h2>
</div>

<div id="categories"></div>

</div>

</section>

</div>


<!-- ADD EXPENSE -->

<section
class="card"
style="margin-top:14px"
id="formCard">

<div class="section-title">
<h2>➕ नया खर्च</h2>
</div>


<div class="formgrid">


<div class="field">

<label>Category</label>

<select id="category">

<option value="दूध">🥛 दूध</option>
<option value="सब्जी">🥦 सब्जी</option>
<option value="नमकीन">🍿 नमकीन</option>
<option value="फल">🍎 फल</option>
<option value="किराना">🛒 किराना</option>
<option value="यात्रा">🚗 यात्रा</option>
<option value="मोबाइल / रिचार्ज">📱 मोबाइल / रिचार्ज</option>
<option value="दवाई">💊 दवाई</option>
<option value="बाहर का खाना">🍽️ बाहर का खाना</option>
<option value="बिजली / बिल">⚡ बिजली / बिल</option>
<option value="घर का खर्च">🏠 घर का खर्च</option>
<option value="अन्य">📦 अन्य</option>

</select>

</div>


<div class="field">

<label>Amount (₹)</label>

<input
id="amount"
type="number"
min="0"
step="0.01"
placeholder="0"
>

</div>


<div class="field">

<label>Date</label>

<input id="date" type="date">

</div>


<div class="field">

<label>Time (optional)</label>

<input id="time" type="time">

</div>


<div class="field full">

<label>वस्तु / सामान का नाम</label>

<input
id="productName"
type="text"
placeholder="जैसे चप्पल, कपड़े, पेन, सब्जी"
>

</div>


<div class="field full">

<label>Note (optional)</label>

<input
id="note"
placeholder="कोई अतिरिक्त जानकारी"
>

</div>

</div>


<div class="actions">

<button
class="btn primary"
onclick="addExpense()">
Save Expense
</button>

<button
class="btn ghost"
onclick="resetForm()">
Clear
</button>

<button
class="btn ghost"
onclick="toggleShareBox()">
📤 Share
</button>

<button
class="btn ghost"
onclick="showHistory()">
📜 History
</button>

</div>


<!-- SHARE DATE RANGE -->

<div id="shareBox" class="share-box">

<div class="section-title">
<h2>📤 Share Expense</h2>
</div>

<div class="share-grid">

<div class="field">

<label>From Date</label>

<input
id="shareFrom"
type="date"
>

</div>


<div class="field">

<label>To Date</label>

<input
id="shareTo"
type="date"
>

</div>

</div>


<div class="share-actions">

<button
class="btn primary"
onclick="shareDateRange()">
Share
</button>

<button
class="btn ghost"
onclick="toggleShareBox()">
Cancel
</button>

</div>

</div>

</section>


<!-- CURRENT MONTH EXPENSES -->

<section class="card expenses">

<div class="section-title">

<h2>🧾 Expenses</h2>

<span
class="muted"
id="monthLabel">
</span>

</div>

<div id="list"></div>

</section>


<!-- HISTORY -->

<section
id="historyCard"
class="card history-card"
style="display:none">

<div class="section-title">

<h2>📜 History</h2>

<button
class="btn ghost"
onclick="hideHistory()">
Close
</button>

</div>

<div id="historyList"></div>

</section>


</main>


<script>

/* =========================
   CATEGORIES
========================= */

const CATS=[

['🥛','दूध'],
['🥦','सब्जी'],
['🍿','नमकीन'],
['🍎','फल'],
['🛒','किराना'],
['🚗','यात्रा'],
['📱','मोबाइल / रिचार्ज'],
['💊','दवाई'],
['🍽️','बाहर का खाना'],
['⚡','बिजली / बिल'],
['🏠','घर का खर्च'],
['📦','अन्य']

];


/* =========================
   LOAD DATA
========================= */

let expenses=
JSON.parse(
localStorage.getItem('dem_expenses') || '[]'
);


/* =========================
   OLD DATA MIGRATION
========================= */

expenses=expenses.map(x=>{

let old=x.cat;

let converted={

'नमकीन / Snacks':'नमकीन',

'मोबाइल / Recharge':'मोबाइल / रिचार्ज',

'बिजली / Bill':'बिजली / बिल',

'Others':'अन्य'

};

if(converted[old]){
x.cat=converted[old];
}

return x;

});

localStorage.setItem(
'dem_expenses',
JSON.stringify(expenses)
);


/* =========================
   DATE
========================= */

const todayISO=()=>{

let d=new Date();

let year=d.getFullYear();

let month=String(
d.getMonth()+1
).padStart(2,'0');

let day=String(
d.getDate()
).padStart(2,'0');

return `${year}-${month}-${day}`;

};


const monthISO=()=>
todayISO().slice(0,7);


/* =========================
   FORMAT DATE
========================= */

function formatDate(date){

if(!date) return '';

return new Date(
date+'T00:00:00'
).toLocaleDateString(
'hi-IN',
{
day:'2-digit',
month:'2-digit',
year:'numeric'
}
);

}


/* =========================
   INIT
========================= */

function init(){

document.getElementById('month').value=
monthISO();

document.getElementById('date').value=
todayISO();

document.getElementById('budget').value=
localStorage.getItem('dem_budget') || '';

document.getElementById('month')
.addEventListener(
'change',
render
);

document.getElementById('budget')
.addEventListener(
'input',
()=>{

localStorage.setItem(
'dem_budget',
document.getElementById('budget').value
);

render();

});

render();

}


/* =========================
   ADD EXPENSE
========================= */

function addExpense(){

let cat=
document.getElementById('category').value;

let amt=
Number(
document.getElementById('amount').value
);

let date=
document.getElementById('date').value;

let product=
document.getElementById('productName')
.value.trim();

let note=
document.getElementById('note')
.value.trim();


if(!amt || amt<=0 || !date){

alert(
'Category, Amount और Date भरें।'
);

return;

}


/* OTHER CATEGORY */

if(
cat==='अन्य' &&
!product
){

alert(
'अन्य category में वस्तु / सामान का नाम लिखें।'
);

document.getElementById(
'productName'
).focus();

return;

}


/* OTHER CATEGORIES */

if(!product){

product=cat;

}


expenses.push({

id:Date.now(),

cat:cat,

product:product,

amt:amt,

date:date,

time:
document.getElementById('time').value,

note:note

});


localStorage.setItem(
'dem_expenses',
JSON.stringify(expenses)
);

resetForm();

render();

alert('Expense saved successfully!');

}


/* =========================
   DELETE
========================= */

function del(id){

if(
!confirm(
'क्या आप यह expense delete करना चाहते हैं?'
)
){

return;

}

expenses=
expenses.filter(
x=>x.id!==id
);

localStorage.setItem(
'dem_expenses',
JSON.stringify(expenses)
);

render();

if(
document.getElementById(
'historyCard'
).style.display!=='none'
){

renderHistory();

}

}


/* =========================
   RESET
========================= */

function resetForm(){

document.getElementById('amount').value='';

document.getElementById('productName').value='';

document.getElementById('note').value='';

document.getElementById('time').value='';

document.getElementById('date').value=
todayISO();

}


/* =========================
   FOCUS FORM
========================= */

function focusForm(){

document
.getElementById('formCard')
.scrollIntoView({
behavior:'smooth'
});

setTimeout(
()=>{

document
.getElementById('amount')
.focus();

},
350
);

}


/* =========================
   MONEY
========================= */

function money(n){

return '₹'+
Math.round(n)
.toLocaleString('en-IN');

}


/* =========================
   RENDER
========================= */

function render(){

const m=
document.getElementById('month').value
||monthISO();


const data=
expenses.filter(
x=>x.date.startsWith(m)
);


const total=
data.reduce(
(s,x)=>s+x.amt,
0
);


const today=
data.filter(
x=>x.date===todayISO()
)
.reduce(
(s,x)=>s+x.amt,
0
);


const days=
new Date(
Number(m.slice(0,4)),
Number(m.slice(5)),
0
).getDate();


document.getElementById('total')
.textContent=
money(total);


document.getElementById('today')
.textContent=
money(today);


document.getElementById('avg')
.textContent=
money(total/(days||1));


document.getElementById('count')
.textContent=
data.length;


document.getElementById('monthLabel')
.textContent=
new Date(
m+'-01'
)
.toLocaleDateString(
'hi-IN',
{
month:'long',
year:'numeric'
}
);


renderBars(
data,
days
);

renderCats(
data
);

renderList(
data
);

renderBudget(
total
);

}


/* =========================
   DAILY GRAPH
========================= */

function renderBars(
data,
days
){

let vals=
Array.from(
{length:days},
(_,i)=>
data
.filter(
x=>
Number(
x.date.slice(8)
)===i+1
)
.reduce(
(s,x)=>s+x.amt,
0
)
);


let max=
Math.max(
...vals,
1
);


document.getElementById(
'bars'
).innerHTML=

vals.map(
(v,i)=>`

<div class="barwrap">

<div
class="bar"
title="${i+1}: ${money(v)}"
style="
height:${Math.max(
v/max*92,
v?3:1
)}%
">
</div>

<span>${i+1}</span>

</div>

`
).join('');

}


/* =========================
   CATEGORIES
========================= */

function renderCats(
data
){

let map={};


data.forEach(
x=>{

map[x.cat]=
(map[x.cat]||0)+x.amt;

}
);


let arr=

CATS
.map(
x=>({

name:x[1],

icon:x[0],

amt:
map[x[1]]||0

})
)
.filter(
x=>x.amt
)
.sort(
(a,b)=>b.amt-a.amt
);


document.getElementById(
'categories'
).innerHTML=

arr.length?

arr.map(
x=>`

<div class="cat">

<span class="catname">

<span>${x.icon}</span>

${x.name}

</span>

<strong>
${money(x.amt)}
</strong>

</div>

`
).join('')

:

'<div class="empty">इस महीने अभी कोई खर्च नहीं।</div>';

}


/* =========================
   EXPENSE LIST
========================= */

function renderList(
data
){

let sorted=[
...data
].sort(
(a,b)=>
(b.date+b.time)
.localeCompare(
a.date+a.time
)
);


document.getElementById(
'list'
).innerHTML=

sorted.length?

sorted.map(
x=>`

<div class="row">

<div>

<strong>
${escapeHtml(
x.product ||
x.note ||
x.cat
)}
</strong>

<div class="muted">

📅 ${formatDate(x.date)}

${x.time?
' • '+x.time:
''}

</div>

${x.note?
`<div class="muted">
${escapeHtml(x.note)}
</div>`:
''}

</div>


<span class="pill">

${escapeHtml(
x.cat
)}

</span>


<span>

${money(x.amt)}

</span>


<button
class="delete"
onclick="del(${x.id})">

Delete

</button>

</div>

`
).join('')

:

'<div class="empty">इस महीने कोई expense entry नहीं है। ऊपर से खर्च जोड़ें।</div>';

}


/* =========================
   BUDGET
========================= */

function renderBudget(
total
){

let b=
Number(
document.getElementById(
'budget'
).value||0
);


let pct=
b?
Math.min(
total/b*100,
100
):0;


document.getElementById(
'budgetfill'
)
.style.width=
pct+'%';


document.getElementById(
'budgettext'
)
.textContent=

b?

`${money(total)} / ${money(b)} — ${Math.round(pct)}% used`

:

'Budget set नहीं है';

}


/* =========================
   SHARE BOX
========================= */

function toggleShareBox(){

let box=
document.getElementById(
'shareBox'
);

box.classList.toggle(
'show'
);


if(
box.classList.contains('show')
){

document.getElementById(
'shareFrom'
).value=
todayISO();

document.getElementById(
'shareTo'
).value=
todayISO();

box.scrollIntoView({
behavior:'smooth',
block:'nearest'
});

}

}


/* =========================
   SHARE DATE RANGE
========================= */

function shareDateRange(){

let from=
document.getElementById(
'shareFrom'
).value;

let to=
document.getElementById(
'shareTo'
).value;


if(!from || !to){

alert(
'From Date और To Date चुनें।'
);

return;

}


if(from>to){

alert(
'From Date, To Date से पहले होनी चाहिए।'
);

return;

}


let data=
expenses
.filter(
x=>
x.date>=from &&
x.date<=to
)
.sort(
(a,b)=>
(a.date+a.time)
.localeCompare(
b.date+b.time
)
);


if(!data.length){

alert(
'इस date range में कोई expense नहीं है।'
);

return;

}


let total=
data.reduce(
(s,x)=>s+x.amt,
0
);


let text=
`📊 Daily Expense Manager\n\n`;

text+=
`📅 ${formatDate(from)} से ${formatDate(to)} तक\n\n`;


/* DATE WISE SHARE */

let currentDate='';

data.forEach(
x=>{

if(
x.date!==currentDate
){

currentDate=x.date;

text+=
`📅 ${formatDate(x.date)}\n`;

}

text+=
`• ${x.product || x.note || x.cat}`;

text+=
` — ${money(x.amt)}`;

if(x.time){

text+=
` (${x.time})`;

}

text+=
`\n`;

}
);


text+=
`\n💰 Total Expense: ${money(total)}`;


/* SHARE */

if(
navigator.share
){

navigator.share({

title:
'Expense Summary',

text:text

}).catch(
()=>{}
);

}else{

if(
navigator.clipboard
){

navigator.clipboard
.writeText(text)
.then(
()=>{

alert(
'Expense summary copied. अब WhatsApp या किसी भी app में paste कर सकते हैं।'
);

}
);

}else{

alert(text);

}

}

}


/* =========================
   HISTORY
========================= */

function showHistory(){

let card=
document.getElementById(
'historyCard'
);

card.style.display=
'block';

renderHistory();

setTimeout(
()=>{

card.scrollIntoView({
behavior:'smooth'
});

},
100
);

}


function hideHistory(){

document.getElementById(
'historyCard'
).style.display=
'none';

}


/* =========================
   HISTORY LIST
========================= */

function renderHistory(){

let list=
document.getElementById(
'historyList'
);


let data=[
...expenses
].sort(
(a,b)=>
(b.date+b.time)
.localeCompare(
a.date+a.time
)
);


if(!data.length){

list.innerHTML=
'<div class="empty">अभी कोई history नहीं है।</div>';

return;

}


/* DATE GROUP */

let groups={};


data.forEach(
x=>{

if(!groups[x.date]){

groups[x.date]=[];

}

groups[x.date].push(x);

}
);


let dates=
Object.keys(groups)
.sort()
.reverse();


list.innerHTML=
dates.map(
date=>{

let items=
groups[date];

let dayTotal=
items.reduce(
(s,x)=>s+x.amt,
0
);


return `

<div class="history-date">

📅 ${formatDate(date)}

<span class="muted">
— Total ${money(dayTotal)}
</span>

</div>


${items.map(
x=>`

<div class="history-item">

<div class="history-left">

<strong>
${escapeHtml(
x.product ||
x.note ||
x.cat
)}
</strong>

<span class="muted">

${escapeHtml(
x.cat
)}

${x.time?
' • '+x.time:
''}

</span>

${x.note?
`<span class="muted">
${escapeHtml(x.note)}
</span>`:
''}

</div>


<div class="history-right">

<strong>
${money(x.amt)}
</strong>

<button
class="delete"
onclick="del(${x.id})">

Delete

</button>

</div>

</div>

`
).join('')}

`;

}
).join('');

}


/* =========================
   SECURITY
========================= */

function escapeHtml(s){

return String(
s||''
)
.replace(
/[&<>'"]/g,
c=>
({

'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
"'":'&#39;',
'"':'&quot;'

}[c])
);

}


/* =========================
   START
========================= */

init();

</script>

</body>
</html>
